<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
      <button v-on:click="fnIncreaseNum">Increase</button>
      <span>{{ num }}</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <script>
        new Vue({
          el: '#app',
          data: {
            num: 10
          },
          // 데이터의 변화에 따라서 특정 로직을 실행하는 속성
          watch: {
            num: function() {
              this.logText();
            }
          },
          methods: {
            fnIncreaseNum: function() {
              this.num ++;
            },
            logText: function() {
              console.log("changed");
            }
          }
        });
    </script>
</body>
</html>
